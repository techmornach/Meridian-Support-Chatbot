name: Terraform App Runner

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/apprunner
    env:
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Bootstrap ECR and IAM
        run: >
          terraform apply -auto-approve
          -target=aws_ecr_repository.app
          -target=aws_iam_role.apprunner_access_role
          -target=aws_iam_role_policy_attachment.apprunner_ecr_access

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Bootstrap Image
        run: |
          ECR_REPOSITORY_URL="$(terraform output -raw ecr_repository_url)"
          docker build -t "$ECR_REPOSITORY_URL:latest" ../../
          docker push "$ECR_REPOSITORY_URL:latest"

      - name: Terraform Apply Full Stack
        run: terraform apply -auto-approve
