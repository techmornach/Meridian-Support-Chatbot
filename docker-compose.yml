version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: meridian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meridian_chatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - meridian_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meridian_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meridian_postgres_data:
