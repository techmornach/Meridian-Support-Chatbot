[project]
name = "meridian-support-chatbot"
version = "0.1.0"
description = "FastAPI + OpenAI Agents prototype for customer support workflows via MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "email-validator>=2.2.0",
  "mcp>=1.27.0",
  "openai-agents>=0.0.17",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.35",
  "asyncpg>=0.29.0",
  "greenlet>=3.1.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "unit: fast isolated unit tests",
  "integration: tests that call live MCP endpoints",
]

[tool.uv]
package = false
